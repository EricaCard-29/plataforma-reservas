server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/users/**
        - id: resource-service
          uri: ${RESOURCE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/resources/**
        - id: reservation-service
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/reservations/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/audit/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/notifications/**

server:
  port: 8082

spring:
  application:
    name: resource-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/resources_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

services:
  audit-url: ${AUDIT_SERVICE_URL:http://localhost:8084}
